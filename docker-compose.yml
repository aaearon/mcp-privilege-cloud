services:
  mcp-server:
    build: .
    ports:
      - "${MCP_PORT:-8000}:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      CYBERARK_IDENTITY_TENANT_URL: ${CYBERARK_IDENTITY_TENANT_URL:-}
      CYBERARK_CLIENT_ID: ${CYBERARK_CLIENT_ID:-}
      CYBERARK_CLIENT_SECRET: ${CYBERARK_CLIENT_SECRET:-}
      CYBERARK_OAUTH_CLIENT_ID: ${CYBERARK_OAUTH_CLIENT_ID:-}
      CYBERARK_OAUTH_CLIENT_SECRET: ${CYBERARK_OAUTH_CLIENT_SECRET:-}
      CYBERARK_OAUTH_AUDIENCE: ${CYBERARK_OAUTH_AUDIENCE:-}
      CYBERARK_SUBDOMAIN: ${CYBERARK_SUBDOMAIN:-}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
